name: Windows CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Windows/**'
      - '.github/workflows/**'
      - 'build.ps1'
      - 'install.ps1'
  pull_request:
    branches: [ main ]
    paths:
      - 'Windows/**'

jobs:
  test-and-build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add NuGet source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      - name: Restore dependencies
        run: dotnet restore Windows/Pulse.slnx

      - name: Run automated unit tests
        run: dotnet test Windows/Pulse.slnx --configuration Release --no-restore --verbosity normal

      - name: Verify Release Build
        run: dotnet build Windows/Pulse.Windows/Pulse.Windows.csproj -c Release --no-restore
