name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Release Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add NuGet source
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true

      - name: Restore dependencies
        run: dotnet restore Windows/Pulse.slnx

      - name: Run unit tests
        run: dotnet test Windows/Pulse.slnx --configuration Release --no-restore --verbosity normal

      - name: Publish Windows x64 (Standalone Self-Contained)
        run: |
          dotnet publish Windows/Pulse.Windows/Pulse.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/Pulse-Windows-x64-Standalone

      - name: Publish Windows x64 (Framework-Dependent)
        run: |
          dotnet publish Windows/Pulse.Windows/Pulse.Windows.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/Pulse-Windows-x64-Lightweight

      - name: Compress Release Archives & Prepare Artifacts
        shell: pwsh
        run: |
          # Copy standalone exe to root for direct one-click download
          Copy-Item publish/Pulse-Windows-x64-Standalone/Pulse.Windows.exe ./Pulse.Windows.exe

          # Create standalone zip archive
          Compress-Archive -Path publish/Pulse-Windows-x64-Standalone/* -DestinationPath Pulse-Windows-x64.zip

          # Create lightweight zip archive
          Compress-Archive -Path publish/Pulse-Windows-x64-Lightweight/* -DestinationPath Pulse-Windows-x64-framework-dependent.zip

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Pulse for Windows ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Pulse.Windows.exe
            Pulse-Windows-x64.zip
            Pulse-Windows-x64-framework-dependent.zip
